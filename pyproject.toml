[project]
name = "wbmss"
version = "2.2.3"
description = "Weightage based model training and selection system powered by flask."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Yashodhan Ketkar", email = "kykyashodhan@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
]
keywords = ["Machine Learning", "WebApp"]
dependencies = [
    "flask>=3.1.3",
    "flask-assets>=2.1.0",
    "jsmin>=3.0.1",
    "libsass>=0.23.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pygal>=3.1.3",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.3",
    "scikit-learn>=1.9.0",
    "waitress>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaskr"] 

artifacts = [
    "flaskr/schema.sql",
    "flaskr/static/**/*",
    "flaskr/templates/**/*",
]

[tool.flake8]
max-line-length = 120

[tool.uv]
package=false

[tool.uv.workspace]
